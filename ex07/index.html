<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotografías</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Galería de Fotografías</h1>
        <p>Ejemplo de una galería creada utilizando CSS Grid.</p>
    </header>

    <main>

        <section class="galeria">

            <figure class="foto foto1">
                <img src="images/foto1.webp" alt="Fotografía 1">
                <figcaption>Fotografía 1</figcaption>
            </figure>

            <figure class="foto foto2">
                <img src="images/foto2.webp" alt="Fotografía 2">
                <figcaption>Fotografía 2</figcaption>
            </figure>

            <figure class="foto foto3">
                <img src="images/foto3.webp" alt="Fotografía 3">
                <figcaption>Fotografía 3</figcaption>
            </figure>

            <figure class="foto foto4">
                <img src="images/foto4.webp" alt="Fotografía 4">
                <figcaption>Fotografía 4</figcaption>
            </figure>

            <figure class="foto foto5">
                <img src="images/foto5.webp" alt="Fotografía 5">
                <figcaption>Fotografía 5</figcaption>
            </figure>

            <figure class="foto foto6">
                <img src="images/foto6.webp" alt="Fotografía 6">
                <figcaption>Fotografía 6</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>Galería CSS Grid - Carlos Gallego</p>
    </footer>

</body>

</html>
